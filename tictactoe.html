<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic-Tac-Toe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAFAF7;
    --ink: #1C1C1E;
    --ink-soft: #57575C;
    --pine: #2F5D50;
    --line: #DEDBD2;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  main {
    max-width: 420px;
    width: 100%;
    text-align: center;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 400;
    font-size: 2.2rem;
    margin: 0 0 8px;
  }

  .status {
    color: var(--ink-soft);
    font-size: 1.05rem;
    margin-bottom: 28px;
    min-height: 1.6rem;
  }

  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 28px;
  }

  .cell {
    aspect-ratio: 1;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 6px;
    font-family: 'Fraunces', serif;
    font-size: 2.4rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--ink);
    transition: background 0.15s ease;
  }

  .cell:hover:not(.filled) {
    background: #F0F0EA;
  }

  .cell.filled {
    cursor: default;
  }

  .cell.x { color: var(--pine); }
  .cell.o { color: #8A5A3B; }

  button {
    font-family: 'Inter', sans-serif;
    font-size: 0.95rem;
    font-weight: 500;
    background: var(--ink);
    color: var(--bg);
    border: none;
    border-radius: 6px;
    padding: 12px 24px;
    cursor: pointer;
  }

  button:hover {
    background: var(--pine);
  }

  footer {
    margin-top: 32px;
    color: var(--ink-soft);
    font-size: 0.85rem;
  }

  footer a {
    color: var(--pine);
  }
</style>
</head>
<body>

<main>
  <h1>Tic-Tac-Toe</h1>
  <div class="status" id="status">Papu's turn</div>

  <div class="board" id="board"></div>

  <button id="resetBtn">Reset game</button>

  <footer>A two-player browser version of my <a href="https://github.com/">C language project</a>.</footer>
</main>

<script>
  const boardEl = document.getElementById('board');
  const statusEl = document.getElementById('status');
  const resetBtn = document.getElementById('resetBtn');

  let board = Array(9).fill(null);
  let currentPlayer = 'X';
  let gameOver = false;

  const winningLines = [
    [0,1,2], [3,4,5], [6,7,8], // rows
    [0,3,6], [1,4,7], [2,5,8], // columns
    [0,4,8], [2,4,6]           // diagonals
  ];

  function renderBoard() {
    boardEl.innerHTML = '';
    board.forEach((value, index) => {
      const cell = document.createElement('div');
      cell.classList.add('cell');
      if (value) {
        cell.classList.add('filled', value.toLowerCase());
        cell.textContent = value;
      }
      cell.addEventListener('click', () => handleMove(index));
      boardEl.appendChild(cell);
    });
  }

  function checkWinner() {
    for (const line of winningLines) {
      const [a, b, c] = line;
      if (board[a] && board[a] === board[b] && board[a] === board[c]) {
        return board[a];
      }
    }
    return null;
  }

  function handleMove(index) {
    if (gameOver || board[index]) return;

    board[index] = currentPlayer;
    renderBoard();

    const winner = checkWinner();
    if (winner) {
      const winnerName = winner === 'X' ? 'Papu' : 'Lapu';
      statusEl.textContent = `${winnerName} wins!`;
      gameOver = true;
      return;
    }

    if (board.every(cell => cell !== null)) {
      statusEl.textContent = "It's a draw!";
      gameOver = true;
      return;
    }

    currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
    const nextName = currentPlayer === 'X' ? 'Papu' : 'Lapu';
    statusEl.textContent = `${nextName}'s turn`;
  }

  function resetGame() {
    board = Array(9).fill(null);
    currentPlayer = 'X';
    gameOver = false;
    statusEl.textContent = "Papu's turn";
    renderBoard();
  }

  resetBtn.addEventListener('click', resetGame);
  renderBoard();
</script>

</body>
</html>
